<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Catálogo de productos y ofertas de El Puestito, Villa Pehuén, Arauco."
  >

  <title>El Puestito | Minimarket en Arauco</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

<header>

  <div class="marca">

    <img
      class="logo"
      src="img/logo.png"
      alt="El Puestito"
    >

    <span>El Puestito</span>

  </div>

</header>


<div class="hero">

  <img
    src="img/banner.png"
    alt="El Puestito - Todo lo que necesitas, siempre cerca de ti"
  >

</div>


<main>

  <section>

    <h2>🔥 Ofertas destacadas</h2>

    <div
      class="productos"
      id="destacados"
    ></div>

  </section>


  <section>

    <h2>🛒 Nuestro catálogo</h2>

    <input
      class="buscador"
      id="buscador"
      type="search"
      placeholder="🔎 Buscar productos..."
      autocomplete="off"
    >


    <div class="categorias">

      <button
        class="categoria activa"
        data-categoria="todos"
      >
        Todos
      </button>

      <button
        class="categoria"
        data-categoria="abarrotes"
      >
        Abarrotes
      </button>

      <button
        class="categoria"
        data-categoria="bebidas"
      >
        Bebidas
      </button>

      <button
        class="categoria"
        data-categoria="congelados"
      >
        Congelados
      </button>

      <button
        class="categoria"
        data-categoria="refrigerados"
      >
        Refrigerados
      </button>

      <button
        class="categoria"
        data-categoria="aseo"
      >
        Aseo y hogar
      </button>

      <button
        class="categoria"
        data-categoria="snacks"
      >
        Snacks y dulces
      </button>

    </div>


    <div
      class="productos"
      id="catalogo"
    ></div>

  </section>

</main>


<footer class="footer">

  <div class="footer-contenido">

    <h2>El Puestito</h2>

    <p class="footer-frase">
      Todo lo que necesitas, siempre cerca de ti.
    </p>

    <div class="footer-datos">

      <p>
        📍 Villa Pehuén, Pasaje Pura 1686, Arauco
      </p>

      <p>
        🕙 Lunes a domingo · 10:00 a 20:00 hrs
      </p>

    </div>

    <div class="footer-botones">

      <a
        class="footer-boton"
        href="https://maps.app.goo.gl/86GXRtWU74c8cBw39"
        target="_blank"
        rel="noopener"
      >
        📍 Cómo llegar
      </a>

      <a
        class="footer-boton whatsapp"
        href="https://wa.me/56965058325"
        target="_blank"
        rel="noopener"
      >
        💬 Escríbenos por WhatsApp
      </a>

    </div>

    <p class="footer-final">
      © 2026 El Puestito · Arauco
    </p>

  </div>

</footer>


<script src="productos.js"></script>
<script src="app.js"></script>

</body>
</html>
